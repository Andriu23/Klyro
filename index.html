<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Preparar conexión con Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preparar conexión con el servidor de las fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet"> <!-- Cargar las tres tipografías -->
    <title>Klyro | >Klyro | Planificador de tareas</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <header class="header">
        <img class="header-img" src="" alt="Logo Klyro">
        <div class="header-texto">
            <h1 class="header-texto-titulo">Klyro</h1>
            <p class="header-texto-parrafo">Organiza tu mundo. Avanza a tu ritmo.</p>
        </div>
    </header>
    <main class="contenido">
        <div class="contenido-tarjetas">
            <div class="contenedor-tareas">
                <h2 class="titulo-principal">Planificador de Tareas</h2>
                <form action="" id="formTarea" class="formulario-tareas">
                    <h3 class="formulario-titulo">Registrar Tarea</h3>

                    <fieldset class="fieldset">

                        <legend class="fieldset-titulo">Información de la tarea</legend>
                        <div class="campo">
                            <label for="nombre-tarea">Nombre:</label>
                            <input type="text" id="nombre-tarea" name="nombre-tarea" placeholder="Ej. Diseñar el formulario">
                        </div>
                        <div class="campo">
                            <label for="descripcion-tarea">Descripción:</label>
                            <textarea name="descripcion-tarea" id="descripcion-tarea" placeholder="Describe la tarea..."></textarea>
                        </div>
                        <div class="campo">
                            <label for="tipo">Tipo de tarea:</label>
                            <select name="tipo" id="tipo">
                                <option value="">Seleccionar Tipo de tarea</option>
                                <option value="Desarrollo">Desarrollo</option>
                                <option value="Diseño">Diseño</option>
                                <option value="Documentación">Documentación</option>
                                <option value="Pruebas">Pruebas</option>
                            </select>
                        </div>

                    </fieldset>

                    <div class="division-formulario">
                        <fieldset class="fieldset">

                            <legend class="fieldset-titulo">Asignación y seguimiento</legend>
                            <div class="campo">
                                <label for="responsable">Asignado a:</label>
                                <input type="text" id="responsable" name="responsable">
                            </div>
                            <div class="campo">
                                <label for="prioridad">Prioridad:</label>
                                <select name="prioridad" id="prioridad">
                                    <option value="">Seleccionar prioridad</option>
                                    <option value="Baja">Baja</option>
                                    <option value="Media">Media</option>
                                    <option value="Alta">Alta</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label for="estado">Estado:</label>
                                <select name="estado" id="estado">
                                    <option value="">Seleccionar estado</option>
                                    <option value="POR HACER">Por hacer</option>
                                    <option value="EN PROCESO">En proceso</option>
                                    <option value="REVISION">Revisión</option>
                                    <option value="HECHO">Hecho</option>
                                </select>
                            </div>

                        </fieldset>

                        <fieldset class="fieldset">

                            <legend class="fieldset-titulo">Fechas</legend>
                            <div class="campo">
                                <label for="fechaDeCreacion">Fecha de creación:</label>
                                <input type="datetime-local" id="fechaDeCreacion" name="fechaDeCreacion" readonly>
                            </div>
                            <div class="campo">
                                <label for="fechaDeInicio">Fecha de inicio:</label>
                                <input type="date" id="fechaDeInicio" name="fechaDeInicio">
                            </div>
                            <div class="campo">
                                <label for="fechaDeEntrega">Fecha de entrega:</label>
                                <input type="date" id="fechaDeEntrega" name="fechaDeEntrega">
                            </div>

                        </fieldset>
                    </div>
                    <div class="campo">
                        <button type="reset">Limpiar</button>
                        <button type="submit">Crear tarea</button>
                    </div>
                </form>
            </div>

            <div class="blacklog">
                <form action="" class="filtro" id="formFiltro">
                    <h2>Tareas</h2>
                    <fieldset class="fieldset-filtro">
                        <label for="filtro">Buscar por estado:</label>
                        <select name="filtro" id="filtro">
                            <option value="">Todos los estados</option>
                             <option value="POR HACER">Por hacer</option>
                            <option value="EN PROCESO">En proceso</option>
                            <option value="REVISION">Revisión</option>
                            <option value="HECHO">Hecho</option>
                        </select>
                    </fieldset>
                    <button type="button" id="btnEliminarSeleccionadas">Eliminar tareas seleccionadas</button>
                </form>

                <div id="listaTareas"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Mi Proyecto. Todos los derechos reservados.</p>
    </footer>

    <script type="module" src="./src/app.js"></script>
</body>

</html>
